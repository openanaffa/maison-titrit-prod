name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14" # match packageManager; keep bun.lock at lockfileVersion 1

      - name: Install
        run: bun install --frozen-lockfile

      - name: Biome (format + lint)
        run: bunx biome check

      - name: Type check
        run: bunx tsc --noEmit -p web

      - name: Test
        working-directory: web
        run: bun test

      - name: Build
        run: bun run build
