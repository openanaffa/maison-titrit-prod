name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14" # match packageManager; keep bun.lock at lockfileVersion 1

      - name: Install
        run: bun install --frozen-lockfile

      - name: Biome (format + lint)
        run: bunx biome check

      - name: Type check
        run: bunx tsc --noEmit -p web

      - name: Test
        working-directory: web
        run: bun test

      - name: Build
        run: bun run build

      - name: Core Web Vitals (Lighthouse CI, where practical)
        continue-on-error: true
        run: |
          # Lab-based Core Web Vitals check against key routes. Requires a
          # running dev server; when the environment cannot start one, budgets
          # are enforced instead via Vercel Speed Insights field data (75th
          # percentile) at release time — see docs/performance-budgets.md.
          bunx @lhci/cli@0.12.x autorun --config=.lighthouserc.cjs || true
