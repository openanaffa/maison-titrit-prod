version: 2
updates:
  # Keep GitHub Actions versions fresh (checkout, setup-bun, …).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Bun workspace dependencies (root bun.lock). NOTE: Dependabot's bun ecosystem
  # support is still maturing; if these no-op, switch the package updates to
  # Renovate, which handles bun.lock workspaces more reliably.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
